name: CI

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build arxbuild.exe
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe -nologo -out:arxbuild.exe Program.cs

      - name: Upload arxbuild.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: arxbuild
          path: arxbuild.exe

      - name: Check ARX SDK availability
        id: check_sdk
        shell: pwsh
        env:
          ARX_SDK_ROOT: ${{ secrets.ARX_SDK_ROOT }}
        run: |
          if ($env:ARX_SDK_ROOT -ne '') {
            echo "has_sdk=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "has_sdk=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build demo.arx
        if: steps.check_sdk.outputs.has_sdk == 'true'
        shell: pwsh
        env:
          ARX_SDK_ROOT: ${{ secrets.ARX_SDK_ROOT }}
        run: |
          Write-Host "ARX_SDK_ROOT is set, building demo.arx..."
          .\arxbuild.exe demo.cpp --sdk="$env:ARX_SDK_ROOT"

      - name: Upload demo.arx artifact
        if: steps.check_sdk.outputs.has_sdk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-arx
          path: demo.arx

      # ---- Release on push to main/master ----
      - name: Determine release info
        id: release_info
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -match '^refs/tags/v(.+)$') {
            $version = $Matches[0]
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          } elseif ($ref -eq 'refs/heads/main' -or $ref -eq 'refs/heads/master') {
            $date = Get-Date -Format "yyyyMMdd"
            $short_sha = "${{ github.sha }}".Substring(0, 7)
            $version = "latest-${date}-${short_sha}"
            echo "should_release=true" >> $env:GITHUB_OUTPUT
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create release archive
        if: steps.release_info.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $staging = "release-staging"
          $version = "${{ steps.release_info.outputs.version }}"
          New-Item -ItemType Directory -Path $staging -Force

          Copy-Item "arxbuild.exe" $staging
          Copy-Item "Program.cs" $staging
          Copy-Item "arxbuild.csproj" $staging
          Copy-Item "README.md" $staging
          Copy-Item "demo.cpp" $staging

          if (Test-Path "demo.arx") {
            Copy-Item "demo.arx" $staging
          }

          Copy-Item -Path "build_arx_demo" -Destination $staging -Recurse

          Compress-Archive -Path "$staging\*" -DestinationPath "arxbuild-${version}.zip"

      - name: Delete previous latest release
        if: steps.release_info.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $releases = gh release list --repo $repo --limit 50 | Select-String "latest-"
          if ($releases) {
            foreach ($line in $releases) {
              $tagName = ($line -split "`t")[2]
              if ($tagName -match "^latest-") {
                Write-Host "Deleting old latest release: $tagName"
                gh release delete $tagName --repo $repo --yes --cleanup-tag
              }
            }
          }

      - name: Create GitHub Release
        if: steps.release_info.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.version }}
          name: arxbuild ${{ steps.release_info.outputs.version }}
          body: |
            ## arxbuild ${{ steps.release_info.outputs.version }}

            ### Downloads
            - `arxbuild-${{ steps.release_info.outputs.version }}.zip` — contains arxbuild.exe, demo.cpp, and build_arx_demo/

            ### Usage
            ```bash
            arxbuild.exe <source.cpp> [--sdk=PATH] [--platform=x64] [--config=Release]
            ```

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for details.
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          files: |
            arxbuild-${{ steps.release_info.outputs.version }}.zip
            arxbuild.exe
