name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build arxbuild.exe
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe -nologo -out:arxbuild.exe Program.cs

      - name: Build demo.arx (if ARX SDK available)
        if: ${{ secrets.ARX_SDK_ROOT != '' }}
        run: |
          Write-Host "ARX_SDK_ROOT is set, building demo.arx..."
          .\arxbuild.exe demo.cpp --sdk="$env:ARX_SDK_ROOT"
        shell: pwsh
        env:
          ARX_SDK_ROOT: ${{ secrets.ARX_SDK_ROOT }}

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Tag: $tag"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release archive
        shell: pwsh
        run: |
          $staging = "release-staging"
          New-Item -ItemType Directory -Path $staging -Force

          Copy-Item "arxbuild.exe" $staging
          Copy-Item "Program.cs" $staging
          Copy-Item "arxbuild.csproj" $staging
          Copy-Item "README.md" $staging
          Copy-Item "demo.cpp" $staging

          # Include demo.arx if it was built
          if (Test-Path "demo.arx") {
            Copy-Item "demo.arx" $staging
          }

          # Copy build_arx_demo directory
          Copy-Item -Path "build_arx_demo" -Destination $staging -Recurse

          Compress-Archive -Path "$staging\*" -DestinationPath "arxbuild-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: arxbuild ${{ steps.version.outputs.VERSION }}
          body: |
            ## arxbuild ${{ steps.version.outputs.VERSION }}

            ### Downloads
            - `arxbuild-${{ steps.version.outputs.VERSION }}.zip` — contains arxbuild.exe, demo.cpp, and build_arx_demo/

            ### Usage
            ```bash
            arxbuild.exe <source.cpp> [--sdk=PATH] [--platform=x64] [--config=Release]
            ```

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for details.
          draft: false
          prerelease: false
          files: |
            arxbuild-${{ steps.version.outputs.VERSION }}.zip
            arxbuild.exe
